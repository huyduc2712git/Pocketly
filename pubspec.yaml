name: finly
description: "Pocketly (Finly) - Modern Offline-First Personal Finance Management"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & DI
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local Database (Offline-First)
  drift: ^2.24.2
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0

  # Networking & HTTP
  dio: ^5.8.0+1

  # Models & Immutability
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Security & Sensitive Storage
  flutter_secure_storage: ^9.2.4

  # Utils & UI
  intl: ^0.20.2
  uuid: ^4.5.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generators
  build_runner: ^2.4.15
  drift_dev: ^2.24.2
  riverpod_generator: ^2.6.4
  freezed: ^2.5.8
  json_serializable: ^6.9.4

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
